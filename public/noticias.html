<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Notícias e comunicados | CEEP Curitiba</title>
    <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
    <meta
      name="description"
      content="Notícias, comunicados e eventos do CEEP Curitiba."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Bitter:wght@500;600;700&family=Inter:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/base.css" />
    <link rel="stylesheet" href="/css/componentes.css" />
  </head>
  <body>
    <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
    <header class="topo" id="cabecalho"></header>

    <main id="conteudo">
      <div class="cabecalho-pagina">
        <div class="container">
          <p class="trilha"><a href="/">Início</a> / Notícias e comunicados</p>
          <h1>Notícias e comunicados</h1>
          <p>Avisos da escola, comunicados da secretaria e eventos.</p>
        </div>
      </div>

      <section class="secao secao--compacta">
        <div class="container">
          <form class="filtros" id="filtros-noticias">
            <div class="campo">
              <label for="filtro-categoria">Categoria</label>
              <select id="filtro-categoria" name="categoria">
                <option value="">Todas</option>
                <option value="noticia">Notícias</option>
                <option value="comunicado">Comunicados</option>
                <option value="evento">Eventos</option>
              </select>
            </div>
            <div>
              <button class="botao botao--primario" type="submit">
                Filtrar
              </button>
            </div>
          </form>
          <div id="lista-noticias"></div>
        </div>
      </section>
    </main>

    <footer class="rodape" id="rodape"></footer>

    <script src="/js/api.js"></script>
    <script src="/js/dados.js"></script>
    <script src="/js/app.js"></script>
    <script src="/js/componentes.js"></script>
    <script src="/js/noticias.js"></script>
  </body>
</html>
